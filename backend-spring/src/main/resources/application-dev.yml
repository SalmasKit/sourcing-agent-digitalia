spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    com.digitalia.sourcing: DEBUG

app:
  rate-limit:
    # Increased for load testing in dev environment
    requests-per-minute: 1000

