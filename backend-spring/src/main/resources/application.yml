spring:
  application:
    name: sourcing-agent
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sourcing_db}
    username: ${DB_USER:sourcing_user}
    password: ${DB_PASSWORD:sourcing_password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    # 256-bit key generated for HS256: must be base64-encoded and at least 256 bits (32 bytes) long.
    # We will use a standard dev key here.
    secret: ${JWT_SECRET:9a4f2c5d6e7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  agent:
    url: ${AGENT_SERVICE_URL:http://localhost:8000}
    timeout-ms: 60000 # 60 seconds for agent search query
  cors:
    allowed-origins:
      - ${FRONTEND_CORS_ORIGIN:http://localhost:5173}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
