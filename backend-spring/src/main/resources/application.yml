spring:
  application:
    name: sourcing-agent
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sourcing_db}
    username: ${DB_USER:sourcing_user}
    password: ${DB_PASSWORD:sourcing_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: sourcingHikariPool
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${SPRING_MAIL_FROM:noreply@example.com}
    from-name: ${SPRING_MAIL_FROM_NAME:Targetalent Sourcing}
  jwt:
    # In production, this MUST be supplied via the JWT_SECRET environment variable.
    # For local development, a default key is configured in application-dev.yml.
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    cleanup-cron: "0 0 3 * * ?" # Daily purge of expired refresh tokens at 3 AM
  agent:
    url: ${AGENT_SERVICE_URL:http://localhost:8001}
    timeout-ms: 60000 # 60 seconds per HTTP request attempt
    global-timeout-ms: 90000 # 90 seconds global timeout wrapping retries
  cors:
    allowed-origins:
      - ${FRONTEND_CORS_ORIGIN:http://localhost:5173}
  rate-limit:
    enabled: true
    requests-per-minute: 60
  metrics:
    scraper:
      username: ${METRICS_SCRAPER_USERNAME:prometheus}
      # Required: empty password is a valid bcrypt match — MetricsSecurityConfig fails fast if unset.
      password: ${METRICS_SCRAPER_PASSWORD:}


management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        sourcing.agent.client.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs

