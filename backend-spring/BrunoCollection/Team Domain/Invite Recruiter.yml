info:
  name: Invite Recruiter
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/team/invite"
  body:
    type: json
    data: |
      {
        "email": "new.recruiter@digitalia.com",
        "privileges": ["source_candidates", "shortlist_candidates", "manage_notes"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body.data) {
          bru.setEnvVar("invitationId", res.body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
