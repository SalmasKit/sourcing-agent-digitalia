info:
  name: Logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/logout"
  body:
    type: json
    data: |
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("accessToken", "");
          bru.setEnvVar("refreshToken", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
