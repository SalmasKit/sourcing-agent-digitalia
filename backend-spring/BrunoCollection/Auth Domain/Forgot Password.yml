info:
  name: Forgot Password
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/forgot-password"
  body:
    type: json
    data: |
      {
        "email": "recruiter.salma@digitalia.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data) {
          bru.setEnvVar("resetToken", res.body.data.resetToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
