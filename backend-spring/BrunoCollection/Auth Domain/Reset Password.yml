info:
  name: Reset Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  body:
    type: json
    data: |
      {
        "token": "{{resetToken}}",
        "newPassword": "ResetPassword789!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
