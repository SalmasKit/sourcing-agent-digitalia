info:
  name: Change Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/change-password"
  body:
    type: json
    data: |
      {
        "oldPassword": "Password123!",
        "newPassword": "NewPassword456!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
