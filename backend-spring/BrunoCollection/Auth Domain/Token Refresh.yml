info:
  name: Token Refresh
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh"
  body:
    type: json
    data: |
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
