info:
  name: Accept Invite
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/accept-invite"
  body:
    type: json
    data: |
      {
        "token": "invite-token-123",
        "fullName": "New Team Member",
        "password": "InvitePassword123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data) {
          bru.setEnvVar("accessToken", res.body.data.accessToken);
          bru.setEnvVar("refreshToken", res.body.data.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
