<svg width="100%" viewBox="0 0 600 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Targetalent Logo</title>
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14A0B2"/>
      <stop offset="1" stop-color="#0E7C8C"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background Card: ensures contrast in GitHub Dark & Light themes -->
  <rect x="8" y="8" width="584" height="184" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#subtleShadow)"/>

  <!-- Scope Icon -->
  <circle cx="85" cy="100" r="46" fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-dasharray="220 40" stroke-linecap="round" transform="rotate(-24 85 100)"/>
  <line x1="85" y1="40" x2="85" y2="50" stroke="#12151B" stroke-width="4" stroke-linecap="round"/>
  <line x1="85" y1="150" x2="85" y2="160" stroke="#12151B" stroke-width="4" stroke-linecap="round"/>
  <line x1="25" y1="100" x2="35" y2="100" stroke="#12151B" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="100" x2="145" y2="100" stroke="#12151B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="85" cy="100" r="7" fill="url(#tealGrad)"/>

  <!-- Typography -->
  <text x="190" y="112" font-size="54" font-weight="700" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <tspan fill="#12151B">target</tspan><tspan fill="url(#tealGrad)">alent</tspan>
  </text>
  <path d="M382,128 Q457,138 532,128" fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round"/>
  <text x="192" y="152" font-size="12.5" letter-spacing="1.5" fill="#6C7078" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    PRECISION AI SOURCING
  </text>
</svg>