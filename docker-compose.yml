services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sourcing-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sourcing_user
      POSTGRES_PASSWORD: sourcing_password
      POSTGRES_DB: sourcing_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sourcing_user -d sourcing_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-service:
    image: sourcing-agent-service:latest
    pull_policy: never
    container_name: sourcing-agent-service
    ports:
      - "8001:8001"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}

      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - APOLLO_API_KEY=${APOLLO_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - ENRICHMENT_ENABLED=${ENRICHMENT_ENABLED:-true}
      - ENRICHMENT_MONTHLY_QUOTA=${ENRICHMENT_MONTHLY_QUOTA:-1000}
      - DATABASE_URL=postgresql+asyncpg://sourcing_user:sourcing_password@postgres:5432/sourcing_db
    volumes:
      - ./agent-service/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  backend-spring:
    image: sourcing-backend-spring:latest
    pull_policy: never
    container_name: sourcing-backend-spring
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sourcing_db
      - DB_USER=sourcing_user
      - DB_PASSWORD=sourcing_password
      - AGENT_SERVICE_URL=http://agent-service:8001
      - FRONTEND_CORS_ORIGIN=http://localhost:5173
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - JWT_SECRET=${JWT_SECRET}
      - METRICS_SCRAPER_USERNAME=${METRICS_SCRAPER_USERNAME:-prometheus}
      - METRICS_SCRAPER_PASSWORD=${METRICS_SCRAPER_PASSWORD}
      - APP_RATE_LIMIT_REQUESTS_PER_MINUTE=10000
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-mailpit}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-1025}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_SMTP_AUTH:-false}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_SMTP_STARTTLS:-false}
      - SPRING_MAIL_FROM=${SPRING_MAIL_FROM:-noreply@example.com}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_started
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: sourcing-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MP_MAX_MESSAGES=500

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: sourcing-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    environment:
      SCRAPER_PASSWORD: ${METRICS_SCRAPER_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /tmp/prometheus-secrets
        printf '%s' "$$SCRAPER_PASSWORD" > /tmp/prometheus-secrets/password
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle
    depends_on:
      - backend-spring

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sourcing-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  frontend:
    image: sourcing-frontend:latest
    pull_policy: never
    container_name: sourcing-frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend-spring
      - agent-service

volumes:
  postgres_data:
  grafana-data:
