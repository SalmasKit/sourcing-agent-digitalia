services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sourcing-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sourcing_user
      POSTGRES_PASSWORD: sourcing_password
      POSTGRES_DB: sourcing_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcing_user -d sourcing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
