version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pin critical GitHub Actions to stable versions
      - dependency-name: "actions/setup-java"
        versions: ["5.x", "6.x"]
      - dependency-name: "actions/checkout"
        versions: ["5.x", "6.x", "7.x"]
      - dependency-name: "actions/setup-python"
        versions: ["6.x", "7.x"]
      - dependency-name: "actions/upload-artifact"
        versions: ["5.x", "6.x", "7.x"]
      - dependency-name: "actions/cache"
        versions: ["5.x", "6.x"]
      - dependency-name: "SonarSource/sonarcloud-github-action"
        versions: ["4.x", "5.x"]
      - dependency-name: "gitleaks/gitleaks-action"
        versions: ["3.x"]
      - dependency-name: "docker/login-action"
        versions: ["4.x"]
    open-pull-requests-limit: 3

  # Maintain dependencies for Maven (Spring Boot backend)
  - package-ecosystem: "maven"
    directory: "/backend-spring"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Pin major version upgrades that require code changes
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        versions: ["4.x"]
      - dependency-name: "org.flywaydb:flyway-core"
        versions: ["11.x", "12.x", "13.x"]

  # Maintain dependencies for npm (React frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Pin major React version upgrades that require code changes
      - dependency-name: "react"
        versions: ["19.x"]
      - dependency-name: "react-dom"
        versions: ["19.x"]

  # Maintain dependencies for Python pip (Agent Service)
  - package-ecosystem: "pip"
    directory: "/agent-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain Docker images
  - package-ecosystem: "docker"
    directory: "/backend-spring"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agent-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
