version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pin actions/setup-java to v4 for stability with SonarCloud
      - dependency-name: "actions/setup-java"
        versions: ["5.x", "6.x"]

  # Maintain dependencies for Maven (Spring Boot backend)
  - package-ecosystem: "maven"
    directory: "/backend-spring"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for npm (React frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain dependencies for Python pip (Agent Service)
  - package-ecosystem: "pip"
    directory: "/agent-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain Docker images
  - package-ecosystem: "docker"
    directory: "/backend-spring"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/agent-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
