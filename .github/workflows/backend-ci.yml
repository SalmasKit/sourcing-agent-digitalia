name: Backend Spring Boot CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend-spring/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'backend-spring/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-verify:
    name: Maven Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Verify with Maven
        run: |
          cd backend-spring
          mvn -B clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend-spring/target/surefire-reports/
            backend-spring/target/failsafe-reports/
          retention-days: 7

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend-spring/target/site/jacoco/
          retention-days: 7
