name: Backend Spring Boot CI

on:
  push:
    paths:
      - 'backend-spring/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend-spring/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sourcing_user
          POSTGRES_PASSWORD: sourcing_password
          POSTGRES_DB: sourcing_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        cd backend-spring
        mvn -B clean verify

    - name: Run JaCoCo Test Coverage Report
      run: |
        cd backend-spring
        mvn jacoco:report
