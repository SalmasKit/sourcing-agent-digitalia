name: Python Agent Service CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd agent-service
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run Ruff Linter
      run: |
        cd agent-service
        ruff check src

    - name: Run Bandit SAST Security Scan
      run: |
        pip install bandit
        bandit -r agent-service/src -ll -q


    - name: Run Pytest with Coverage
      run: |
        cd agent-service
        pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=48

    - name: Install Trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    - name: Run Trivy Vulnerability Scanner
      run: |
        trivy fs agent-service --severity CRITICAL,HIGH --exit-code 0
      continue-on-error: true


  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & generate coverage
        if: env.SONAR_TOKEN != ''
        run: |
          cd agent-service
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pytest --cov=src --cov-report=xml --cov-report=term

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: agent-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

