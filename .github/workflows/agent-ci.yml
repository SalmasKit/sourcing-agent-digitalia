name: Python Agent Service CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'agent-service/**'
      - '.github/workflows/agent-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd agent-service
        python -m pip install --upgrade --no-cache-dir --only-binary :all: pip==24.3.1
        pip install --no-cache-dir --prefer-binary -e .[dev]

    - name: Run Ruff Linter
      run: |
        cd agent-service
        ruff check src

    - name: Run Bandit SAST Security Scan
      run: |
        pip install --no-cache-dir --only-binary :all: bandit==1.7.10
        bandit -r agent-service/src -ll -q

    - name: Run Pytest with Coverage
      run: |
        cd agent-service
        pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=48

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: 'agent-service'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'
      continue-on-error: true


  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & generate coverage
        run: |
          cd agent-service
          python -m pip install --upgrade --no-cache-dir --only-binary :all: pip==24.3.1
          pip install --no-cache-dir --prefer-binary -e .[dev]
          pytest --cov=src --cov-report=xml --cov-report=term

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: agent-service
          args: >
            -Dsonar.organization=salmaskit
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.scm.branch=${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: false
