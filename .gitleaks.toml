# Gitleaks configuration
[extend]
useDefault = true

[allowlist]
description = "Global allowlist for dummy/test secrets and digests"
paths = [
    '''\.env\.example$''',
    '''backend-spring/src/test/.*''',
    '''agent-service/tests/.*''',
    '''observability/.*'''
]
regexes = [
    '''sqa_[a-f0-9]{40}''', # Sonar local demo token
    '''sourcing_password''',
    '''postgres:5432''',
    '''438664e1ff7481677e0eccd327d0bc3b734e20d7943c8ff10aaecceb3d17e27f'''
]

