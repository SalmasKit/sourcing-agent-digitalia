[project]
name = "agent-service"
version = "0.1.0"
description = "Digitalia Sourcing Agent — FastAPI + LangGraph + Groq + MCP"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "fastmcp>=2.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "orjson>=3.10.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = [".", "src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
